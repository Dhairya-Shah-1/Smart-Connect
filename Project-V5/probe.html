<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Probe</title>
    <script>
      // Seed auth + theme so ProtectedRoute lets us into /dashboard,
      // then rewrite the URL BEFORE main.tsx / BrowserRouter loads.
      try {
        localStorage.setItem(
          'currentUser',
          JSON.stringify({
            id: 'probe-user',
            role: 'user',
            name: 'Probe User',
            email: 'probe@example.com',
          })
        );
        localStorage.setItem('theme', 'dark');
      } catch (e) {}
      history.replaceState(null, '', '/dashboard');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
